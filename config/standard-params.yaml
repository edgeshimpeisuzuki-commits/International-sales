# 標準パラメータ(定義書「標準パラメータ」タブが正本。数値はすべて仮置き)
scoring:            # D06-01
  weights: {fit: 40, volume: 30, category_track_record: 20, contact_quality: 10}
  rank_a_min: 70
  rank_b_min: 50
outreach:           # D06-03
  body_words: [50, 100]
  follow_up_days: [4, 10]
  max_follow_ups: 2
  sg_subject_prefix: "<ADV> "
stop_rules:         # D06-03, D14-17
  bounce_rate_stop: 0.02
  spam_complaints_slowdown: 1      # 苦情・「迷惑」1件で送信量を半分
  spam_complaints_stop_per_week: 2 # 1週間に2件で全停止(返信は続ける)
  unsubscribe_reflect_hours: 24    # D12-09
  no_contact_after_no_response_days: 180
  recontact_after_days: 60
reply_classification:   # D06-04
  confidence_to_human: 0.8
meeting:            # D06-21
  length_minutes: [30, 60]
  buffer_minutes: 15
  min_days_ahead: 4                # 営業日は使わない(定義書2.3、11/15変更)
  reminders_hours_before: [24, 1]
  slots_to_offer: 3
  hold_expiry_hours: 48
proposal:           # D06-20
  submit_for_approval_hours_before: 48   # #88
  human_check_hours_before: 24
  target_slides: 10
watchdog:           # 定義書19.6
  alert_hours_without_completion: 12
  manual_takeover_hours: 24
approval_backlog_alert: 20     # 24時間超の承認待ちがこの件数を超えたら新規の下書きを減らす

service_delivery:      # D16-04
  acceptance_reply_days: 10       # 納品から検収の回答までの期限(スキルの記載に合わせた。11/16)
